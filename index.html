
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music TXT to ZIP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{background:#111217;color:#eee;font:16px -apple-system,sans-serif;padding:16px}
main{max-width:720px;margin:auto}
button,input{padding:12px;margin:6px 0;border-radius:9px}
button{background:#7467e8;color:white;border:0}
.item{padding:12px 0;border-bottom:1px solid #444}
small{color:#bbb}
</style>
</head>
<body>
<main>
<h2>🎵 Music TXT → ZIP</h2>
<p>Загрузи TXT: исполнитель и название на каждой строке.</p>
<input id="file" type="file" accept=".txt,text/plain">
<button id="search">Начать поиск</button>
<button id="zip" disabled>Создать ZIP</button>
<p id="status">Ожидаю TXT.</p>
<div id="results"></div>

<script>
const $=id=>document.getElementById(id);
let available=[];

$("search").onclick=async()=>{
 const file=$("file").files[0];
 if(!file){$("status").textContent="Сначала выбери TXT.";return;}
 const songs=(await file.text()).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 available=[];
 $("results").replaceChildren();
 $("zip").disabled=true;

 for(let i=0;i<songs.length;i++){
  const row=document.createElement("div");
  row.className="item";
  row.textContent=`${i+1}/${songs.length}: ${songs[i]} — поиск…`;
  $("results").append(row);
  $("status").textContent=`Обработано ${i}/${songs.length}`;

  try{
   const q=encodeURIComponent('title:"'+songs[i]+'" AND mediatype:audio');
   const url=`https://archive.org/advancedsearch.php?q=${q}&fl[]=identifier,title,creator&rows=5&page=1&output=json`;
   const res=await fetch(url);
   if(!res.ok)throw Error("HTTP "+res.status);
   const data=await res.json();
   const docs=data.response?.docs||[];

   if(!docs.length){
    row.textContent=`${i+1}. ${songs[i]} — не найдено`;
    continue;
   }

   row.replaceChildren();
   const title=document.createElement("div");
   title.textContent=`${i+1}. ${songs[i]}`;
   row.append(title);

   docs.forEach(doc=>{
    const a=document.createElement("a");
    a.href="https://archive.org/details/"+encodeURIComponent(doc.identifier);
    a.target="_blank";
    a.rel="noopener noreferrer";
    a.textContent="Открыть: "+(doc.title||doc.identifier);
    a.style.display="block";
    a.style.color="#bcb2ff";
    row.append(a);
    available.push({requested:songs[i],identifier:doc.identifier});
   });
  }catch(e){
   row.textContent=`${i+1}. ${songs[i]} — ошибка поиска: ${e.message}`;
  }
  await new Promise(r=>setTimeout(r,250));
 }
 $("status").textContent=`Поиск завершён. Найдено материалов: ${available.length}. Проверь содержимое и условия скачивания каждого материала.`;
 $("zip").disabled=available.length===0;
};

$("zip").onclick=()=>{
 $("status").textContent="Перед сборкой ZIP нужно проверить метаданные каждого материала и разрешённые аудиофайлы. Открывай найденные материалы и скачивай только файлы, доступные для такого использования.";
};
</script>
</main>
</body>
</html>
