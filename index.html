
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music TXT → ZIP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{background:#111217;color:#f5f5f7;font:16px -apple-system,sans-serif;
padding:16px;margin:0}
main{max-width:760px;margin:auto}
textarea,input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;
background:#202127;color:white;border:1px solid #454650;border-radius:10px}
textarea{min-height:180px}
button{background:#7667ee;color:white;border:0;border-radius:9px;
padding:12px;margin:4px 3px}
.card{border-top:1px solid #454650;padding:12px 0}
a{color:#b9b0ff;overflow-wrap:anywhere}
small{color:#b9bac5}
</style>
</head>
<body>
<main>
<h2>🎵 Music TXT → ZIP</h2>
<p>Вставь список песен — по одной на строку.</p>
<textarea id="list" placeholder="EMIN, JONY - Камин&#10;JONY - Комета"></textarea>
<button id="search">Начать поиск</button>
<button id="zip" disabled>Собрать ZIP из выбранных файлов</button>
<p id="status">Ожидаю список.</p>
<div id="results"></div>
<script>
const $=id=>document.getElementById(id);
let found=[];

$("search").onclick=async()=>{
 const songs=$("list").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(!songs.length){$("status").textContent="Вставь список песен.";return;}
 found=[];
 $("results").replaceChildren();
 $("zip").disabled=true;

 for(let i=0;i<songs.length;i++){
  $("status").textContent=`Поиск ${i+1}/${songs.length}: ${songs[i]}`;
  const card=document.createElement("div");
  card.className="card";
  const title=document.createElement("strong");
  title.textContent=songs[i];
  card.append(title);
  $("results").append(card);

  try{
   const endpoint="https://bakha.me/?search="+encodeURIComponent(songs[i]);
   const response=await fetch(endpoint);
   if(!response.ok)throw Error("HTTP "+response.status);
   const data=await response.json();
   const tracks=(data.songs||[]).filter(t=>t.download);

   if(!tracks.length){
    card.append(document.createTextNode(" — совпадений нет"));
    continue;
   }

   tracks.slice(0,3).forEach(t=>{
    const p=document.createElement("p");
    const a=document.createElement("a");
    a.href=t.link||t.download;
    a.target="_blank";
    a.rel="noopener noreferrer";
    a.textContent=(t.artist||"Неизвестный исполнитель")+" — "+
      (t.title||"Без названия")+" ("+(t.duration||"?")+")";
    p.append(a);
    card.append(p);
    const d=document.createElement("p");
    const dl=document.createElement("a");
    dl.href=t.download;
    dl.target="_blank";
    dl.rel="noopener noreferrer";
    dl.textContent="Открыть ссылку аудио";
    d.append(dl);
    card.append(d);
    found.push({requested:songs[i],title:t.title,artist:t.artist,
      duration:t.duration,url:t.download});
   });
  }catch(e){
   card.append(document.createTextNode(
    " — поиск недоступен: "+e.message+
    ". Возможно, браузер блокирует запрос (CORS)."
   ));
  }
  await new Promise(resolve=>setTimeout(resolve,350));
 }
 $("status").textContent=`Поиск завершён. Найдено вариантов: ${found.length}. Проверь версии перед скачиванием.`;
 $("zip").disabled=found.length===0;
};

$("zip").onclick=async()=>{
 $("status").textContent=
 "Автоматическая загрузка внешних MP3 может быть заблокирована браузером или источником. Открой ссылки аудио и скачай разрешённые файлы в «Файлы», затем используй локальную сборку ZIP.";
};
</script>
</main>
</body>
</html>
