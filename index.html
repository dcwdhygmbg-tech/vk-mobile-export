
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HitMoz Music Queue</title>
<style>
body{margin:0;padding:18px;background:#111217;color:#f5f5f7;
font:16px -apple-system,sans-serif}
main{max-width:720px;margin:auto}
textarea,input{box-sizing:border-box;width:100%;padding:12px;
margin:8px 0;background:#202127;color:white;border:1px solid #454650;
border-radius:10px;font-size:16px}
textarea{min-height:180px}
button,a{display:inline-block;padding:12px;margin:4px 2px;
background:#7667ee;color:white;border:0;border-radius:9px;
text-decoration:none;font-size:15px}
.item{padding:12px 0;border-bottom:1px solid #41414b}
small{color:#b9bac5}
</style>
</head>
<body>
<main>
<h2>🎵 HitMoz — очередь песен</h2>
<p>Вставь песни по одной на строку. Для каждого названия
будет подготовлена ссылка поиска.</p>
<textarea id="list" placeholder="EMIN, JONY — Камин&#10;Miyagi — Captain"></textarea>
<button id="run">Обработать список</button>
<p id="status"></p>
<div id="results"></div>
<script>
const $=id=>document.getElementById(id);
let songs=[];
let index=0;

$("run").onclick=()=>{
 songs=$("list").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 index=0;
 $("results").replaceChildren();
 next();
};

function next(){
 if(index>=songs.length){
  $("status").textContent="Обработано названий: "+songs.length;
  return;
 }
 const name=songs[index];
 $("status").textContent=`Песня ${index+1} из ${songs.length}`;
 const row=document.createElement("div");
 row.className="item";
 const title=document.createElement("div");
 title.textContent=`${index+1}. ${name}`;
 row.append(title);
 const a=document.createElement("a");
 a.href="https://eu.hitmoz.com/search?q="+encodeURIComponent(name);
 a.target="_blank";
 a.rel="noopener noreferrer";
 a.textContent="Открыть поиск HitMoz";
 row.append(a);
 const done=document.createElement("button");
 done.textContent="Следующая песня";
 done.onclick=()=>{index++;next();};
 row.append(done);
 $("results").append(row);
}
</script>
</main>
</body>
</html>
